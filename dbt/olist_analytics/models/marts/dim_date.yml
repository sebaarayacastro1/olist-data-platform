
version: 2

models:
  - name: dim_date
    description: "Dimension calendrier pour les analyses temporelles."

    columns:
      - name: date_id
        description: "Identifiant de la date au format YYYYMMDD."
        data_tests:
          - unique
          - not_null

      - name: date
        description: "Date complète."
        data_tests:
          - unique
          - not_null

      - name: month
        description: "Mois de l'année, de 1 à 12."
        data_tests:
          - not_null

      - name: quarter
        description: "Trimestre de l'année, de 1 à 4."
        data_tests:
          - not_null

      - name: year
        description: "Année civile."
        data_tests:
          - not_null
