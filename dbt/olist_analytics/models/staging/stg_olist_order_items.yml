
version: 2

models:
  - name: stg_olist_order_items
    description: "Modèle de staging des articles de commande Olist."

    columns:
      - name: order_id
        description: "Identifiant de la commande."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_orders')
                field: order_id

      - name: order_item_id
        description: "Position de l'article dans la commande."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifiant du produit."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifiant du vendeur."
        data_tests:
          - not_null

      - name: price
        description: "Prix de l'article hors frais de livraison."
        data_tests:
          - not_null

      - name: freight_value
        description: "Frais de livraison associés à l'article."
        data_tests:
          - not_null
